---
- hosts: '{{target|default("all")}}'
#  gather_facts: false 
  ignore_errors: true
  become: true
  serial: 50
  tasks:

    - name: Check if Tainium is installed
      stat:
        path: /opt/Tanium
      register: register_tanium

    - name: Check if Cortex installed correctly
      stat:
        path: /opt/traps
      register: register_traps

    - name: Check if Cortex installed correctly
      stat:
        path: /opt/splunkforwarder
      register: register_splunk

    - name: Check if Cortex installed correctly
      stat:
        path: /opt/tivoli
      register: register_tivoli

    - debug:
        var: register_traps 
      when: not register_traps.stat.exists
      register: no_traps

    - debug:
        var: register_splunk
      when: not register_splunk.stat.exists
      register: no_splunk

    - debug:
        var: register_tivoli
      when: not register_tivoli.stat.exists
      register: no_tivoli


