- name: "4.2.17 | PATCH | Ensure sshd MaxStartups is configured"
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: (?i)MaxStartups
      line: "MaxStartups {{ rhel8cis_sshd['maxstartups'] }}"

