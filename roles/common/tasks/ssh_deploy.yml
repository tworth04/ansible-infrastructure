---
- hosts: '{{target|default("all")}}'
#  gather_facts: false 
  ignore_errors: true
  become: true
  serial: 100
  tasks:

    - name: Create a user linux admin users with a home directory
      user:
        name: "{{ item }}"
        state: present
        create_home: yes
      loop:
        - ansible-user
        - sp19363
      tags:
        - always

    - name: Create a user linux admin users with a home directory
      user:
        name: "{{ item }}"
        state: present
        create_home: yes
      loop:
        - gitlab-runner
        - webmaster
      tags:
        - gitlab

    - name: Delete wrong username 
      user:
        name: kb51131
        state: absent
      tags:
        - always

    - name: Create svc_ansible system account with a home directory
      user:
        name: svc_ansible
        system: true
        state: present
        create_home: yes
      tags:
        - always

#    - name: Create user's .ssh directory if not present
##      file:
#        path: /home/{{ item }}/.ssh
#        mode: '0700'
#      loop:
#        - ansible-user
#        - sp19363
#        - kb51131
#        - svc_ansible

    - name: Set up travis's authorized key
      authorized_key:
        user: root
        state: present
        exclusive: true
        manage_dir: true
        key: "{{ lookup('file', '/home/ansible-user/.ssh/sat_rsa') }}"
      tags:
        - always

    - name: Set up travis's authorized key
      authorized_key:
        user: ansible-user
        state: present
        exclusive: true
        manage_dir: true
        key: "{{ lookup('file', '/home/ansible-user/.ssh/id_rsa.pub') }}"
      tags:
        - always

    - name: Set up svc_ansible's authorized key
      authorized_key:
        user: svc_ansible
        state: present
        key: "{{ lookup('file', '/home/svc_ansible/.ssh/id_rsa.pub') }}"
      tags:
        - always

    - name: Set up steve's authorized key
      authorized_key:
        user: sp19363
        state: present
        key: "{{ lookup('file', '/home/sp19363/.ssh/id_rsa.pub') }}"
      tags:
        - always

    - name: Set up kranthi's authorized key
      authorized_key:
        user: kb51131
        state: absent
        key: "{{ lookup('file', '/home/kb51131/.ssh/id_rsa.pub') }}"
      tags:
        - always

    - name: Set up kranthi's authorized key
      authorized_key:
        user: "{{ item }}"
        state: present
        key: "{{ lookup('file', '/home/ansible-user/.ssh/gitlab_authkey') }}"
      loop:
        - webmaster
        - gitlab-runner
      tags:
        - gitlab

    - name: Ensure svc_ansible user has correct password
      lineinfile:
        path: /etc/selinux/config
        regexp: '^svc_ansible'
        line: "svc_ansible:!!:19564:0:99999:7:::" 
