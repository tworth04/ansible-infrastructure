---
# Initial attempt to grow and resize any existing LVM-backed partitions
- name: "Pre-check: Attempt growpart and pvresize on all LVM-backed partitions"
  ansible.builtin.shell: |
    echo "Scanning for LVM-backed partitions..."
    for pv in $(lsblk -pn -o NAME,TYPE | awk '$2 == "part" {print $1}' | grep -E '^/dev/' | while read part; do
      if pvs "$part" &>/dev/null; then echo "$part"; fi
    done); do
      disk=$(lsblk -no PKNAME "$pv")
      partnum=$(echo "$pv" | grep -o '[0-9]*$')
      echo "Attempting growpart on /dev/$disk $partnum"
      growpart /dev/$disk $partnum || echo "growpart failed on /dev/$disk $partnum"
      echo "Attempting pvresize on $pv"
      pvresize "$pv" || echo "pvresize failed on $pv"
    done
  register: pre_lvm_resize_attempt
  changed_when: "'CHANGED' in pre_lvm_resize_attempt.stdout or 'successfully resized' in pre_lvm_resize_attempt.stdout"
  failed_when: false
  tags: storage

- name: Log pre-resize attempt output
  ansible.builtin.debug:
    var: pre_lvm_resize_attempt.stdout

# VMware disk expansion logic
- name: Set disk and partition number from selected PV
  ansible.builtin.set_fact:
    disk_to_grow: "{{ selected_pv | regex_replace('[0-9]+$', '') }}"
    part_num_to_grow: "{{ selected_pv | regex_search('[0-9]+$', ignorecase=True) }}"

- name: Get current disk size from ansible_devices
  ansible.builtin.set_fact:
    current_disk_size: "{{ ansible_devices[disk_to_grow].size | regex_replace(' GB','') | float }}"
  when: disk_to_grow is defined

- name: Get VM disk info from vSphere
  community.vmware.vmware_guest_disk_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ inventory_hostname }}"
  delegate_to: localhost
  register: vm_disks

- name: Set disk list fact
  ansible.builtin.set_fact:
    disk_list: "{{ vm_disks.guest_disk_info.disks | default([]) }}"

- name: Calculate unit_number_guess for disk
  ansible.builtin.set_fact:
    unit_number_guess: "{{ (disk_to_grow | regex_replace('^sd','') | regex_replace('[^a-z]','') | length | int - 1) }}"
  when: disk_to_grow is defined

- name: Map VMware controller details or fallback
  ansible.builtin.set_fact:
    controller_number: "{{ (disk_list | selectattr('unit_number','equalto', unit_number_guess) | map(attribute='controller_number') | first) | default(0) }}"
    controller_type: "{{ (disk_list | selectattr('unit_number','equalto', unit_number_guess) | map(attribute='controller_type') | first) | default('paravirtual') }}"
  when: disk_to_grow is defined

- name: Increase VM disk size in vSphere
  community.vmware.vmware_guest_disk:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ inventory_hostname }}"
    disk:
      - unit_number: "{{ unit_number_guess }}"
        size_gb: "{{ current_disk_size | int + expansion_size_gb }}"
        controller_number: "{{ controller_number }}"
        controller_type: "{{ controller_type }}"
  delegate_to: localhost
  register: disk_extension_status
  when: disk_to_grow is defined

- name: Rescan SCSI bus
  ansible.builtin.shell: |
    for host in $(ls /sys/class/scsi_host/); do
      echo "- - -" > "/sys/class/scsi_host/${host}/scan"
    done
  args:
    executable: /bin/bash
  when: disk_extension_status.changed

- name: Refresh hardware facts after disk resize
  ansible.builtin.setup:
    gather_subset:
      - hardware
  when: disk_extension_status.changed

# Final attempt to grow and resize LVM-backed partitions after disk expansion
- name: "Post-check: Attempt growpart and pvresize on all LVM-backed partitions"
  ansible.builtin.shell: |
    echo "Scanning for LVM-backed partitions..."
    for pv in $(lsblk -pn -o NAME,TYPE | awk '$2 == "part" {print $1}' | grep -E '^/dev/' | while read part; do
      if pvs "$part" &>/dev/null; then echo "$part"; fi
    done); do
      disk=$(lsblk -no PKNAME "$pv")
      partnum=$(echo "$pv" | grep -o '[0-9]*$')
      echo "Attempting growpart on /dev/$disk $partnum"
      growpart /dev/$disk $partnum || echo "growpart failed on /dev/$disk $partnum"
      echo "Attempting pvresize on $pv"
      pvresize "$pv" || echo "pvresize failed on $pv"
    done
  register: post_lvm_resize_attempt
  changed_when: "'CHANGED' in post_lvm_resize_attempt.stdout or 'successfully resized' in post_lvm_resize_attempt.stdout"
  failed_when: false
  tags: storage

- name: Log post-resize attempt output
  ansible.builtin.debug:
    var: post_lvm_resize_attempt.stdout
