---

- name: Create directory structure if not present
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/apps/dw-uf_outputs/local
    state: directory
    mode: '0755'
    owner: splunkfwd
    group: splunkfwd

- name: Update Forwarding Server addresses
  ansible.builtin.copy:
    src: "{{ splunk_outputs }}"
    dest: /opt/splunkforwarder/etc/apps/dw-uf_outputs/local/outputs.conf
    owner: splunkfwd
    group: splunkfwd

- name: First, create the directory
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/system/local
    state: directory
    recurse: yes

- name: Copy Conf file to /opt/splunkforwarder/etc/system/local/user-seed.conf
  ansible.builtin.copy:
    src: "{{ splunk_config }}"
    dest: /opt/splunkforwarder/etc/system/local/user-seed.conf
    force: true
    owner: splunkfwd
    group: splunkfwd
