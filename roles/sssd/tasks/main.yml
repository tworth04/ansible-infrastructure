---
- name: confirm system not previously joined to AD
  command: "realm leave"

- name: double check
  command: "realm leave"

- name: remove krb5.keytab
  ansible.builtin.file:
    path: /etc/krb5.keytab
    state: absent

- name: Join system to AD
  ansible.builtin.expect:
    command: "realm join -U {{ bind_username }} EXAMPLE.ADP.AD "
    responses: 
      Password for *: "{{ bind_password }}"


