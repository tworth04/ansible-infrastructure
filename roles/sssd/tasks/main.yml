- name: Copy Conf file to /etc/sssd/sssd.conf
  ansible.builtin.copy:
    #src: /etc/sssd/sssd.conf
    src: files/sssd.conf
    #src: "{{ sssd }}"
    dest: /etc/sssd/sssd.conf
    force: true

- name: restart sssd service
  ansible.builtin.systemd_service:
    name: sssd
    state: restarted
    enabled: true
